spring.application.name=cinema-web
spring.datasource.url=jdbc:mysql://localhost:3306/cinema_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Phần của Hậu (đặt vé / phòng chiếu / suất chiếu) ---
# BẮT BUỘC: giữ nguyên tên cột camelCase (maPhong, tenGhe...) như trong 01_schema.sql.
# Mặc định Spring đổi maPhong -> ma_phong nên sẽ lỗi "Unknown column" nếu thiếu dòng này.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Tùy chọn: thông số nghiệp vụ (đã có giá trị mặc định trong CauHinhRap, chỉ khai báo khi muốn đổi)
#cinema.giu-ghe.so-phut=10
#cinema.giu-ghe.so-ghe-toi-da=8
#cinema.diem.dong-moi-diem-tich=10000
#cinema.diem.dong-moi-diem-doi=1000

