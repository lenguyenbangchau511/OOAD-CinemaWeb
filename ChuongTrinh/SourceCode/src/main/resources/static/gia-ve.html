<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách giá vé | MegaCine</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/quan-ly.css">
    <link rel="stylesheet" href="css/megacine-pages.css">
    <link rel="stylesheet" href="css/noi-bo-shell.css">
    <script type="module" src="js/noi-bo-shell.js"></script>
    <script type="module" src="js/gia-ve.js"></script>
</head>
<body class="mc-page" data-nb-screen="gia">
<header class="nb-header" id="nb-header"></header>
<div class="nb-layout"><aside class="nb-sidebar" id="nb-sidebar"></aside><main class="main chau-page nb-main">
    <div class="page-title">
        <div>
            <h1>Danh sách giá vé</h1>
            <p>Mức giá theo loại vé, đối tượng, loại ghế, loại ngày và thời gian áp dụng.</p>
        </div>
        <a class="button primary" href="gia-ve-form.html">+ Thêm giá vé</a>
    </div>

    <form class="filters" id="bo-loc" role="search">
        <div class="field"><label for="tu-khoa">Mã giá vé</label><input id="tu-khoa" type="search" placeholder="Ví dụ GV01"></div>
        <div class="field"><label for="loc-loai-ve">Loại vé</label><select id="loc-loai-ve"></select></div>
        <div class="field"><label for="loc-doi-tuong">Đối tượng</label><select id="loc-doi-tuong"></select></div>
        <div class="field"><label for="loc-loai-ghe">Loại ghế</label><select id="loc-loai-ghe"></select></div>
        <div class="field"><label for="loc-loai-ngay">Loại ngày</label><select id="loc-loai-ngay"></select></div>
        <div class="field"><label for="gia-tu">Giá từ (₫)</label><input id="gia-tu" type="number" min="0" step="1000"></div>
        <div class="field"><label for="gia-den">Giá đến (₫)</label><input id="gia-den" type="number" min="0" step="1000"></div>
        <div class="field"><label for="loc-trang-thai">Trạng thái</label><select id="loc-trang-thai"></select></div>
        <div class="actions">
            <button class="button primary" type="submit">Tìm kiếm</button>
            <button class="button secondary" type="button" id="xoa-loc">Xóa lọc</button>
        </div>
    </form>

    <div class="alert" id="thong-bao" hidden></div>
    <div id="ket-qua"></div>
</main></div>
<footer class="nb-footer" id="nb-footer"></footer>
</body>
</html>
