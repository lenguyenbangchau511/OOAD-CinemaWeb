<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thêm / sửa suất chiếu | MegaCine</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/dat-ve.css">
    <link rel="stylesheet" href="css/noi-bo-shell.css">
    <script type="module" src="js/noi-bo-shell.js"></script>
    <script type="module" src="js/nghiep-vu-noi-bo.js"></script>
</head>
<body data-nb-screen="lich" data-nghiep-vu="suat-form">
<header class="nb-header" id="nb-header"></header>
<div class="nb-layout">
    <aside class="nb-sidebar" id="nb-sidebar"></aside>
    <main class="main nb-main">
        <div class="page-title"><h1>Thêm / sửa suất chiếu</h1></div>
        <p id="thong-bao" role="status" hidden></p>
        <a href="suat-chieu.html">← Lịch suất chiếu</a>
        <p class="muted">Chế độ xem trước. Thao tác trên màn này không ghi vào cơ sở dữ liệu.</p>
        <form id="form" class="chau-card">
            <div class="chau-fields">
                <label>Phim <select name="maPhim" required></select></label>
                <label>Phòng chiếu <select name="maPhong" required></select></label>
                <label>Ngày chiếu <input name="ngayChieu" type="date" required></label>
                <label>Giờ bắt đầu <input name="gioBatDau" type="time" required></label>
                <label>Giờ kết thúc <input name="gioKetThuc" type="time" required></label>
            </div>
            <button class="button primary" type="submit">Xem trước suất chiếu</button>
        </form>
        <section id="ket-qua" class="chau-card" hidden></section>
    </main>
</div>
<footer class="nb-footer" id="nb-footer"></footer>
</body>
</html>
