<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinema 11 | Lịch sử mua vé</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/dat-ve.css">
    <script type="module" src="js/lich-su-ve.js"></script>
</head>
<body>
<header class="header">
    <div class="container header-inner">
        <a class="brand" href="./"><span class="brand-mark" aria-hidden="true">C</span>Cinema 11</a>
        <nav aria-label="Menu chính">
            <a href="./">Trang chủ</a>
            <a href="./#phim">Phim</a>
            <a href="lich-su-ve.html" aria-current="page">Lịch sử vé</a>
        </nav>
        <div class="header-right" id="nguoi-dung"></div>
    </div>
</header>

<main class="container main">
    <div class="page-title">
        <div>
            <h1>Lịch sử mua vé</h1>
            <p id="ghi-chu">Các giao dịch đặt vé của bạn, mới nhất xếp trước.</p>
        </div>
    </div>

    <form class="filters" id="bo-loc" role="search">
        <div class="field">
            <label for="tu-khoa" id="nhan-tu-khoa">Mã đơn hoặc mã vé</label>
            <input id="tu-khoa" type="search" placeholder="Ví dụ DH01, V01">
        </div>
        <div class="field">
            <label for="tu-ngay">Từ ngày</label>
            <input id="tu-ngay" type="date">
        </div>
        <div class="field">
            <label for="den-ngay">Đến ngày</label>
            <input id="den-ngay" type="date">
        </div>
        <div class="field">
            <label for="tt-don">Trạng thái đơn</label>
            <select id="tt-don">
                <option value="">Tất cả</option>
                <option value="DA_THANH_TOAN">Đã thanh toán</option>
                <option value="CHO_THANH_TOAN">Chờ thanh toán</option>
                <option value="DA_HUY">Đã hủy</option>
            </select>
        </div>
        <div class="field">
            <label for="tt-ve">Trạng thái vé</label>
            <select id="tt-ve">
                <option value="">Tất cả</option>
                <option value="CHUA_SU_DUNG">Chưa sử dụng</option>
                <option value="DA_SU_DUNG">Đã sử dụng</option>
                <option value="DA_HUY">Đã hủy</option>
                <option value="HET_HAN">Hết hạn</option>
                <option value="DA_DOI">Đã đổi</option>
            </select>
        </div>
        <div class="actions">
            <button type="submit" class="button primary">Tìm kiếm</button>
            <button type="button" class="button secondary" id="xoa-loc">Xóa lọc</button>
        </div>
    </form>

    <div id="thong-bao" role="status" hidden></div>
    <p class="muted" id="so-ket-qua" role="status" style="margin-bottom:12px"></p>
    <div id="ket-qua"></div>
</main>

<footer class="footer">
    <div class="container footer-inner">
        <div><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">C</span>Cinema 11</a>
            <p>Website quản lý rạp chiếu phim.</p></div>
        <div><strong>Liên hệ demo</strong><p>hello@cinema11.example<br>TP. Hồ Chí Minh, Việt Nam</p></div>
        <div><strong>Hỗ trợ</strong><p>Giao dịch lỗi hoặc cần hoàn tiền: liên hệ quầy vé với mã đơn hàng.</p></div>
    </div>
</footer>
</body>
</html>
